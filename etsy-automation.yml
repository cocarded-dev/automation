name: Etsy Order Fulfillment Automation

on:
  schedule:
    - cron: '0 18 * * *'  # Runs daily at 6 PM UTC
  workflow_dispatch:      # Allows manual triggering from GitHub UI

jobs:
  process-orders:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install Chrome for Selenium
      run: |
        sudo apt-get update
        sudo apt-get install -y wget gnupg
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google.list
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
    
    - name: Create output directories
      run: |
        mkdir -p output temp
    
    - name: Run order processing
      env:
        ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
        ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
        ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
        ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
        ETSY_ACCESS_TOKEN_SECRET: ${{ secrets.ETSY_ACCESS_TOKEN_SECRET }}
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        SUPPLIER_EMAIL: ${{ secrets.SUPPLIER_EMAIL }}
        EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        PSD_FILES_BASE_URL: ${{ secrets.PSD_FILES_BASE_URL }}
        GOOGLE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_CREDENTIALS }}
        SCHEDULE_TIME: ${{ secrets.SCHEDULE_TIME || '18:00' }}
        TIMEZONE: ${{ secrets.TIMEZONE || 'America/New_York' }}
      run: |
        python main.py
    
    - name: Upload artifacts (optional)
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: order-processing-output
        path: |
          output/
          automation.log
        retention-days: 7